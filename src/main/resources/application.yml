spring:
  application:
    name: Cocky-Server

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/cocky?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:cocky}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret-key: ${JWT_SECRET_KEY:local-dev-only-jwt-secret-key-please-change-in-production-0000000000}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

datagsm:
  authorization-base-url: https://oauth.authorization.datagsm.kr
  resource-base-url: https://oauth.resource.datagsm.kr
  client-id: ${DATAGSM_CLIENT_ID:}
  client-secret: ${DATAGSM_CLIENT_SECRET:}
  redirect-uri: ${DATAGSM_REDIRECT_URI:}

auth:
  admin-emails: ${ADMIN_EMAILS:}


# 채점 엔진 선택: judge0 | runner | stub. 기본 stub(항상 가짜 결과 — 채점 VM이 없는 환경용).
# runner면 runner.url/token 필수(비면 기동 실패). judge0면 judge0.url이 비었을 때 stub으로 폴백한다.
# time/memory 제한은 problem별 컬럼이 생기기 전까지 쓰는 엔진 공통 전역 기본값.
judge:
  engine: ${JUDGE_ENGINE:stub}
  default-time-limit-ms: 2000
  default-memory-limit-kb: 131072

# 로컬에서 Judge0를 직접 띄워 붙일 땐 JUDGE_ENGINE=judge0 JUDGE0_URL=http://localhost:2358
judge0:
  url: ${JUDGE0_URL:}
  token: ${JUDGE0_TOKEN:}

# cocky-runner (자체 채점 서버). read-timeout은 judge 호출(케이스 전체 채점)을 기다리는 시간.
runner:
  url: ${RUNNER_URL:}
  token: ${RUNNER_TOKEN:}
  connect-timeout-ms: 3000
  read-timeout-ms: 60000

# POST /api/v1/run — 유저당 분당 호출 제한(인메모리)
run:
  rate-limit-per-minute: 10


ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout-ms: 60000
  models:
    generation: ${OPENAI_MODEL_GENERATION:gpt-5.4-mini}
    instant-feedback: ${OPENAI_MODEL_INSTANT_FEEDBACK:gpt-5.4-nano}
    round-feedback: ${OPENAI_MODEL_ROUND_FEEDBACK:gpt-5.4-nano}
    weekly-feedback: ${OPENAI_MODEL_WEEKLY_FEEDBACK:gpt-5.4-mini}
    monthly-feedback: ${OPENAI_MODEL_MONTHLY_FEEDBACK:gpt-5.4-mini}
  executor: ${AI_EXECUTOR:local}
  exec:
    timeout-ms: 5000
  generation:
    max-attempts: 3
    similarity-threshold: 0.80
  # 즉시 피드백은 제출 API에서 동기로 기다리는 경로라 문제 생성(60000ms/3회)보다 짧게 잡는다.
  # max-attempts는 재시도 횟수가 아니라 총 시도 횟수다(1이면 단발 호출).
  instant-feedback:
    timeout-ms: 10000
    max-attempts: 1